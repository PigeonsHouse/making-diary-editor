services:
  app:
    build:
      context: .
      target: app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
      REDIS_URL: redis://redis:6379
      VOICEVOX_URL: http://voicevox:50021
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATA_DIR: /data
      RENDER_CACHE_VERSION: ${RENDER_CACHE_VERSION:-diary-video-h264-crf15-v2}
    volumes:
      - diary-data:/data
    networks:
      default:
        aliases:
          - diary-web
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      CHROMIUM_PATH: /usr/bin/chromium
      APP_URL: http://diary-web:3000
      RENDER_CACHE_VERSION: ${RENDER_CACHE_VERSION:-diary-video-h264-crf15-v2}
      RENDER_GPU_MODE: ${RENDER_GPU_MODE:-auto}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-auto}
      RENDER_X264_PRESET: ${RENDER_X264_PRESET:-veryfast}
      RENDER_SOFTWARE_CRF: ${RENDER_SOFTWARE_CRF:-15}
      RENDER_GPU_VIDEO_BITRATE: ${RENDER_GPU_VIDEO_BITRATE:-12M}
      RENDER_MEDIA_CACHE_MB: ${RENDER_MEDIA_CACHE_MB:-2048}
      RENDER_OFFTHREAD_VIDEO_THREADS: ${RENDER_OFFTHREAD_VIDEO_THREADS:-4}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-120000}
      RENDER_TIMEOUT_RETRY_CONCURRENCY: ${RENDER_TIMEOUT_RETRY_CONCURRENCY:-4}
      RENDER_PSD_CONCURRENCY: ${RENDER_PSD_CONCURRENCY:-2}
      RENDER_PROGRESS_INTERVAL_MS: ${RENDER_PROGRESS_INTERVAL_MS:-750}
      RENDER_LOG_INTERVAL_MS: ${RENDER_LOG_INTERVAL_MS:-15000}
    shm_size: "2gb"
    volumes:
      - diary-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  voicevox:
    image: voicevox/voicevox_engine:cpu-0.26.0-dev
    ports:
      - "50021:50021"
    entrypoint:
      - /bin/bash
      - -c
      - chown -R user:user /home/user/.local/share/voicevox-engine && exec /entrypoint.sh
    volumes:
      - voicevox-data:/home/user/.local/share/voicevox-engine

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  diary-data:
  postgres-data:
  redis-data:
  voicevox-data:
