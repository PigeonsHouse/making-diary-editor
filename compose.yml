services:
  app:
    build:
      context: .
      target: app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
      REDIS_URL: redis://redis:6379
      VOICEVOX_URL: http://voicevox:50021
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATA_DIR: /data
    volumes:
      - diary-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  renderer:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      CHROMIUM_PATH: /usr/bin/chromium
      APP_URL: http://app:3000
    volumes:
      - diary-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./drizzle/0000_initial.sql:/docker-entrypoint-initdb.d/0000_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  diary-data:
  postgres-data:
  redis-data:
